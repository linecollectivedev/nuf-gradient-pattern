<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17100d">
  <title>NUF Pattern Studio</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="preview-stage" id="preview-stage">
    <canvas id="pattern-canvas" aria-label="Animated NUF pattern preview"></canvas>
  </main>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div><strong>NUF Pattern</strong><span>Liquid studio</span></div>
    </div>
    <div class="topbar-actions">
      <button class="icon-button favorite-button" id="save-favorite" title="Save current preset as favorite" aria-label="Save current preset as favorite">☆</button>
      <button class="icon-button" id="randomize" title="Randomize pattern" aria-label="Randomize pattern">↝</button>
      <button class="secondary-button" id="toggle-motion">Pause</button>
      <div class="export-group" title="Export PNG with selected resolution">
        <button class="primary-button" id="export-png">Export PNG</button>
        <select class="export-res-select" data-key="exportResolution" title="Select PNG Resolution" aria-label="Select PNG Resolution">
          <option value="1">2K</option>
          <option value="2">4K</option>
          <option value="4">8K</option>
        </select>
      </div>
    </div>
  </header>

  <aside class="panel" id="control-panel">
    <div class="panel-heading">
      <div><span class="eyebrow">Pattern controls</span><h1>Shape the flow</h1></div>
      <button class="panel-toggle" id="panel-toggle" aria-label="Toggle controls" aria-expanded="true">×</button>
    </div>

    <button class="advanced-toggle" id="advanced-toggle" type="button" aria-expanded="false">
      <span><strong>Advanced settings</strong><small>Fine-tune shape, motion, type and output</small></span>
      <i aria-hidden="true">+</i>
    </button>

    <div class="panel-scroll">
      <section class="control-section" open>
        <button class="section-title" type="button" aria-expanded="true"><span>Pattern</span><span>01</span></button>
        <div class="section-content">
          <label class="control control-select"><span>Mode</span><select data-key="mode"><option value="0">Liquid Voronoi</option><option value="1">Radial flow</option><option value="2">Falling flow</option><option value="3">Field contours</option></select></label>
          <label class="control control-range"><span>Density</span><output data-output="density"></output><input data-key="density" type="range" min="1" max="8" step="0.1"></label>
          <label class="control control-range"><span>Scale</span><output data-output="scale"></output><input data-key="scale" type="range" min="0.35" max="3" step="0.01"></label>
          <label class="control control-range advanced-only"><span>Distortion</span><output data-output="distortion"></output><input data-key="distortion" type="range" min="0" max="2.5" step="0.01"></label>
          <label class="control control-range advanced-only"><span>Swirl</span><output data-output="swirl"></output><input data-key="swirl" type="range" min="-3" max="3" step="0.01"></label>
          <div class="control-pair advanced-only">
            <label class="control control-range compact"><span>Center X</span><output data-output="centerX"></output><input data-key="centerX" type="range" min="-1" max="1" step="0.01"></label>
            <label class="control control-range compact"><span>Center Y</span><output data-output="centerY"></output><input data-key="centerY" type="range" min="-1" max="1" step="0.01"></label>
          </div>
        </div>
      </section>

      <section class="control-section" open>
        <button class="section-title" type="button" aria-expanded="true"><span>Blob dynamics</span><span>02</span></button>
        <div class="section-content">
          <label class="control control-toggle"><span>Organic shapes</span><input data-key="showBlobs" type="checkbox"><i></i></label>
          <label class="control control-range"><span>Blob count</span><output data-output="blobCount"></output><input data-key="blobCount" type="range" min="1" max="32" step="1"></label>
          <label class="control control-range"><span>Blob size</span><output data-output="blobSize"></output><input data-key="blobSize" type="range" min="0.2" max="2.5" step="0.01"></label>
          <label class="control control-range"><span>Liquid texture</span><output data-output="liquidTexture"></output><input data-key="liquidTexture" type="range" min="0" max="2" step="0.01"></label>
          <label class="control control-range advanced-only"><span>Separation</span><output data-output="separation"></output><input data-key="separation" type="range" min="0.25" max="3" step="0.01"></label>
          <label class="control control-range advanced-only"><span>Edge softness</span><output data-output="softness"></output><input data-key="softness" type="range" min="0.001" max="0.25" step="0.001"></label>
          <label class="control control-range advanced-only"><span>Edge width</span><output data-output="edgeWidth"></output><input data-key="edgeWidth" type="range" min="0.005" max="0.6" step="0.005"></label>
        </div>
      </section>

      <section class="control-section" open>
        <button class="section-title" type="button" aria-expanded="true"><span>Motion</span><span>03</span></button>
        <div class="section-content">
          <label class="control control-range"><span>Drift speed</span><output data-output="speed"></output><input data-key="speed" type="range" min="0" max="3" step="0.01"></label>
          <label class="control control-range"><span>Flow</span><output data-output="flow"></output><input data-key="flow" type="range" min="-0.6" max="0.6" step="0.01"></label>
          <label class="control control-range advanced-only"><span>Turbulence</span><output data-output="turbulence"></output><input data-key="turbulence" type="range" min="0" max="2" step="0.01"></label>
          <label class="control control-range advanced-only"><span>Seed</span><output data-output="seed"></output><input data-key="seed" type="range" min="0" max="12" step="1"></label>
        </div>
      </section>

      <section class="control-section" open>
        <button class="section-title" type="button" aria-expanded="true"><span>Palette</span><span>04</span></button>
        <div class="section-content color-grid">
          <label class="color-control"><span>Base</span><input data-key="baseColor" type="color"></label>
          <label class="color-control"><span>Body</span><input data-key="bodyColor" type="color"></label>
          <label class="color-control"><span>Mid</span><input data-key="midColor" type="color"></label>
          <label class="color-control"><span>Edge</span><input data-key="edgeColor" type="color"></label>
        </div>
      </section>

      <section class="control-section advanced-section">
        <button class="section-title" type="button" aria-expanded="false"><span>Typography</span><span>05</span></button>
        <div class="section-content">
          <label class="control control-toggle"><span>Show text layer</span><input data-key="showText" type="checkbox"><i></i></label>
          <label class="control control-textarea"><span>Text</span><textarea data-key="textContent" rows="3" spellcheck="false"></textarea></label>
          <label class="control control-select"><span>Font</span><select data-key="fontFamily"><option value="Arial Black">Arial Black</option><option value="Georgia">Georgia</option><option value="Impact">Impact</option><option value="Trebuchet MS">Trebuchet</option><option value="Courier New">Courier New</option></select></label>
          <label class="control control-range"><span>Text size</span><output data-output="textSize"></output><input data-key="textSize" type="range" min="0.35" max="2.4" step="0.01"></label>
          <label class="control control-range"><span>Letter spacing</span><output data-output="letterSpacing"></output><input data-key="letterSpacing" type="range" min="-30" max="80" step="1"></label>
          <label class="control control-range"><span>Text softness</span><output data-output="textSoftness"></output><input data-key="textSoftness" type="range" min="0" max="0.25" step="0.005"></label>
          <label class="color-control wide"><span>Text color</span><input data-key="textColor" type="color"></label>
          <label class="control control-select"><span>Blend</span><select data-key="textBlend"><option value="0">Normal</option><option value="1">Invert</option><option value="2">Difference</option></select></label>
        </div>
      </section>

      <section class="control-section advanced-section">
        <button class="section-title" type="button" aria-expanded="false"><span>Finish & performance</span><span>06</span></button>
        <div class="section-content">
          <label class="control control-range"><span>Film grain</span><output data-output="grain"></output><input data-key="grain" type="range" min="0" max="0.25" step="0.005"></label>
          <label class="control control-select"><span>Render quality</span><select data-key="renderScale"><option value="0.5">Performance · 50%</option><option value="0.75">Balanced · 75%</option><option value="1">Full · 100%</option></select></label>
          <label class="control control-select"><span>Frame rate</span><select data-key="fps"><option value="24">24 FPS</option><option value="30">30 FPS</option><option value="60">60 FPS</option></select></label>
          <label class="control control-select"><span>PNG resolution</span><select data-key="exportResolution"><option value="1">2K · 1920 base</option><option value="2">4K · 2× size</option><option value="4">8K · 4× size</option></select></label>
          <label class="control control-select"><span>Favorite presets</span><select id="favorite-list" aria-label="Favorite presets"><option value="">No saved favorites</option></select></label>
          <label class="control control-input"><span>Preset name</span><input id="favorite-name" type="text" maxlength="48" placeholder="Choose a favorite first"></label>
          <div class="preset-actions preset-actions-three">
            <button class="wide-button" id="load-favorite" type="button">Load favorite</button>
            <button class="ghost-button" id="rename-favorite" type="button">Rename</button>
            <button class="ghost-button" id="delete-favorite" type="button">Delete</button>
          </div>
          <div class="preset-io-actions">
            <button class="ghost-button" id="download-preset" type="button" title="Download current preset as JSON file">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              <span>Download JSON</span>
            </button>
            <button class="ghost-button" id="upload-preset-btn" type="button" title="Upload and load preset from JSON file">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span>Upload JSON</span>
            </button>
            <input type="file" id="preset-file-input" accept=".json,application/json" hidden>
          </div>
          <button class="wide-button" id="record-video">Record 6s video</button>
          <button class="ghost-button" id="reset-controls">Reset controls</button>
        </div>
      </section>
    </div>
  </aside>

  <nav class="ratio-bar" aria-label="Canvas dimensions and aspect ratio">
    <label><strong>W</strong><input data-key="canvasWidth" type="number" min="320" max="8192" step="1" inputmode="numeric"><span>px</span></label>
    <label><strong>H</strong><input data-key="canvasHeight" type="number" min="320" max="8192" step="1" inputmode="numeric"><span>px</span></label>
    <select data-key="aspectRatio" aria-label="Canvas aspect ratio">
      <option value="16:9">HD 16:9</option>
      <option value="4:3">Classic 4:3</option>
      <option value="1:1">Square 1:1</option>
      <option value="4:5">Portrait 4:5</option>
      <option value="9:16">Story 9:16</option>
      <option value="custom">Custom</option>
    </select>
  </nav>

  <button class="open-panel" id="open-panel" aria-label="Open controls">Controls</button>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="performance" id="performance">GPU · <span>-- fps</span></div>
  <script src="./app.js"></script>
</body>
</html>
